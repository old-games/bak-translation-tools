name: Font editor for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "src/baktt/fonts.py"
      - "src/baktt/encoding.py"
      - "src/baktt/gui/**"
      - "lib/filebuffer/**"
      - "packaging/font_editor.py"
      - ".github/workflows/font-editor-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./lib/filebuffer
          python -m pip install . pyinstaller
      - name: Build
        run: >
          pyinstaller --onefile --windowed --name baktt-font-editor
          packaging/font_editor.py
      - uses: actions/upload-artifact@v4
        with:
          name: baktt-font-editor-windows
          path: dist/baktt-font-editor.exe
