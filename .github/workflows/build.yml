# Build of the translated game from the translation system (SP) for testers.
#
# The project export comes from SP by the export token (only when it changed:
# ETag), the original game from the build file server (SFTPGo), both paths
# from manifest.json (project.build, set in SP: project settings -> "Выгрузка
# для сборки" -> "Файлы сборки"). The build has the developers' menu on and
# goes back to the file server as krondor-ru-latest.zip (overwritten each
# time); its report is on the summary page of the run. See
# `baktt build-from-sp --help`.
#
# Secrets: OG_TRANSLATE_TOKEN (SP export token), SFTPGO_URL (without /api/v2),
# SFTPGO_API_KEY (the build user's key). Variable: OG_PROJECT_ID.
name: Build from SP

on:
  schedule:
    - cron: "0 2 */4 * *" # every 4 days (1st, 5th, 9th... of a month), 05:00 Moscow (02:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/fonts/**"
      - "lib/filebuffer/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"

concurrency:
  group: build-from-sp
  cancel-in-progress: false

env:
  SP_URL: https://translate.old-games.ru

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the last export and its ETag: a scheduled run without changes stops,
      # a manual run or a push builds from the cached export
      - uses: actions/cache@v4
        with:
          path: sp
          key: sp-export-${{ github.run_id }}
          restore-keys: sp-export-

      - name: Download the SP export
        id: export
        env:
          OG_TRANSLATE_TOKEN: ${{ secrets.OG_TRANSLATE_TOKEN }}
          PROJECT: ${{ vars.OG_PROJECT_ID }}
        run: |
          set -eu
          : "${OG_TRANSLATE_TOKEN:?no secret OG_TRANSLATE_TOKEN}"
          : "${PROJECT:?no variable OG_PROJECT_ID}"
          mkdir -p sp
          url="$SP_URL/v1/export/projects/$PROJECT.zip"
          for attempt in 1 2 3; do
            set -- -sS -o sp/new.zip -D sp/headers -w '%{http_code}' \
              -H "Authorization: Bearer $OG_TRANSLATE_TOKEN"
            if [ -f sp/etag ] && [ -f sp/project.zip ]; then
              set -- "$@" -H "If-None-Match: $(cat sp/etag)"
            fi
            code=$(curl "$@" "$url")
            case $code in
              200)
                unzip -tq sp/new.zip >/dev/null || { echo "::error::the SP export is broken"; exit 1; }
                mv sp/new.zip sp/project.zip
                grep -i '^etag:' sp/headers | cut -d' ' -f2- | tr -d '\r' > sp/etag
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "SP export downloaded"
                exit 0 ;;
              304)
                rm -f sp/new.zip
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "SP export not changed"
                exit 0 ;;
              429)
                wait=$(grep -i '^retry-after:' sp/headers | tr -dc '0-9')
                echo "429, retry in ${wait:-10} s"
                sleep "${wait:-10}" ;;
              *)
                echo "::error::SP export: HTTP $code $(head -c 300 sp/new.zip 2>/dev/null)"
                exit 1 ;;
            esac
          done
          exit 1

      - name: Decide
        id: go
        run: |
          if [ "${{ steps.export.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "The translation did not change since the last build" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build paths from manifest.json
        id: paths
        if: steps.go.outputs.build == 'true'
        run: |
          set -eu
          unzip -p sp/project.zip manifest.json > sp/manifest.json
          dir=$(jq -r '.project.build.originalDir // empty' sp/manifest.json)
          file=$(jq -r '.project.build.originalFile // empty' sp/manifest.json)
          builds=$(jq -r '.project.build.buildsDir // empty' sp/manifest.json)
          if [ -z "$file" ] || [ -z "$builds" ]; then
            echo "::error::set the build files in SP: project settings -> Выгрузка для сборки -> Файлы сборки"
            exit 1
          fi
          echo "original=${dir%/}/$file" >> "$GITHUB_OUTPUT"
          echo "original_name=$file" >> "$GITHUB_OUTPUT"
          echo "builds=${builds%/}" >> "$GITHUB_OUTPUT"

      - name: Download the original game
        if: steps.go.outputs.build == 'true'
        env:
          SFTPGO_URL: ${{ secrets.SFTPGO_URL }}
          SFTPGO_API_KEY: ${{ secrets.SFTPGO_API_KEY }}
          ORIGINAL: ${{ steps.paths.outputs.original }}
          NAME: ${{ steps.paths.outputs.original_name }}
        run: |
          set -eu
          # under its own name: the report shows it
          mkdir -p original
          curl -fsSL -G -H "X-SFTPGO-API-KEY: $SFTPGO_API_KEY" --data-urlencode "path=$ORIGINAL" \
            -o "original/$NAME" "${SFTPGO_URL%/}/api/v2/user/files"
          unzip -tq "original/$NAME" >/dev/null
          echo "original: $ORIGINAL ($(sha256sum "original/$NAME" | cut -c1-16)…)"

      - uses: actions/setup-python@v5
        if: steps.go.outputs.build == 'true'
        with:
          python-version: "3.13"

      - name: Install the tools
        if: steps.go.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./lib/filebuffer
          python -m pip install .

      - name: Build
        id: build
        if: steps.go.outputs.build == 'true'
        env:
          NAME: ${{ steps.paths.outputs.original_name }}
        run: |
          mkdir -p out
          set +e
          baktt build-from-sp sp/project.zip "original/$NAME" out/krondor-ru-latest.zip \
            --report-path out/krondor-ru-latest.md --cheats \
            --revision "${GITHUB_SHA::7}" --sp-url "$SP_URL"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -f out/krondor-ru-latest.md ]; then cat out/krondor-ru-latest.md >> "$GITHUB_STEP_SUMMARY"; fi
          case $code in
            0) ;;
            2) echo "::warning::built with translation errors, see the report" ;;
            *) echo "::error::the build failed, see the report"; exit 1 ;;
          esac

      - name: Upload to the file server
        if: steps.go.outputs.build == 'true' && steps.build.outputs.code != '1'
        env:
          SFTPGO_URL: ${{ secrets.SFTPGO_URL }}
          SFTPGO_API_KEY: ${{ secrets.SFTPGO_API_KEY }}
          BUILDS: ${{ steps.paths.outputs.builds }}
        run: |
          set -eu
          upload() {
            path=$(jq -rn --arg p "$BUILDS/$2" '$p | @uri')
            curl -fsS -o /dev/null -X POST -H "X-SFTPGO-API-KEY: $SFTPGO_API_KEY" -H "Content-Type: $3" \
              --data-binary "@$1" "${SFTPGO_URL%/}/api/v2/user/files/upload?path=$path&mkdir_parents=true"
            echo "uploaded $BUILDS/$2"
          }
          upload out/krondor-ru-latest.zip krondor-ru-latest.zip application/zip
